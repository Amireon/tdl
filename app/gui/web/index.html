<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TDL · Telegram 下载助手</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <a class="brand" href="/">
    <span class="brand-logo">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </span>
    <span class="brand-name">TDL<small>Telegram 下载助手</small></span>
  </a>
  <div id="auth-bar">
    <span id="auth-status">连接中…</span>
    <button id="btn-auth" class="primary">登录</button>
    <button id="btn-settings" class="ghost" title="设置">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      设置
    </button>
  </div>
</header>

<section id="add-section">
  <h2 class="card-title">
    <span class="h-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg></span>
    添加任务
  </h2>
  <form id="add-form">
    <div class="field">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 17H7A5 5 0 0 1 7 7h2"/><path d="M15 7h2a5 5 0 1 1 0 10h-2"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <input type="url" id="inp-url" placeholder="粘贴 Telegram 消息链接（必填）" required>
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <input type="text" id="inp-author" placeholder="作者（作为子文件夹）">
    </div>
    <div class="field">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <input type="text" id="inp-dir" placeholder="下载目录（留空使用默认）">
    </div>
    <button type="submit" class="primary">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      添加
    </button>
  </form>
</section>

<section id="tasks-section">
  <div class="section-head">
    <h2 class="card-title">
      <span class="h-ico"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></span>
      任务列表<span class="count-badge" id="task-count">0</span>
    </h2>
    <div id="task-actions">
      <button id="btn-start-all">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M8 5.14v13.72a1 1 0 0 0 1.54.84l10.3-6.86a1 1 0 0 0 0-1.68L9.54 4.3A1 1 0 0 0 8 5.14z"/></svg>
        全部开始
      </button>
      <button id="btn-clear-done">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        清空已完成
      </button>
    </div>
  </div>
  <div class="table-wrap">
  <table id="task-table">
    <thead>
      <tr>
        <th>状态</th>
        <th>链接</th>
        <th>作者</th>
        <th>保存位置</th>
        <th>进度</th>
        <th>操作</th>
      </tr>
    </thead>
    <tbody id="task-tbody">
    </tbody>
  </table>
  </div>
</section>

<!-- Login Modal -->
<div id="login-modal" class="modal">
  <div class="modal-content">
    <span class="close" id="login-close">&times;</span>
    <h3>登录 Telegram</h3>
    <div id="login-step-phone">
      <input type="tel" id="login-phone" placeholder="手机号，如 +86 12345678900">
      <button id="btn-send-code" class="primary">发送验证码</button>
    </div>
    <div id="login-step-code" style="display:none">
      <input type="text" id="login-code" placeholder="输入收到的验证码">
      <button id="btn-submit-code" class="primary">验证</button>
    </div>
    <div id="login-step-password" style="display:none">
      <input type="password" id="login-password" placeholder="二步验证密码">
      <button id="btn-submit-password" class="primary">确认</button>
    </div>
    <p id="login-error" class="error"></p>
  </div>
</div>

<!-- Settings Modal -->
<div id="settings-modal" class="modal">
  <div class="modal-content">
    <span class="close" id="settings-close">&times;</span>
    <h3>设置</h3>
    <form id="settings-form">
      <label class="field-label">代理（socks5 / http / https）</label>
      <input type="text" id="set-proxy" placeholder="socks5://127.0.0.1:1080">
      <label class="field-label">默认下载目录</label>
      <input type="text" id="set-default-dir">
      <label class="field-label">默认作者</label>
      <input type="text" id="set-default-author">
      <label class="field-label">最大并发任务数</label>
      <input type="number" id="set-max-concurrent" min="1" max="10" value="1">
      <label class="field-label">单文件线程数</label>
      <input type="number" id="set-threads" min="1" max="32" value="4">
      <label class="field-label">同任务并发数</label>
      <input type="number" id="set-limit" min="1" max="16" value="2">
      <label class="check"><input type="checkbox" id="set-rewrite-ext"> 根据 MIME 重写扩展名</label>
      <label class="check"><input type="checkbox" id="set-skip-same"> 跳过同名同大小文件</label>
      <button type="submit" class="primary">保存</button>
    </form>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
